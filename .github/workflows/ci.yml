name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-cpp:
    name: Configure + build C++/Qt target
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run placeholder artifact
        run: build/Release/patchorchestrator.exe
